name: Daily build

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC every day
  workflow_dispatch:       # "Run workflow" button for an instant refresh after an upload
  push:
    branches: [main]

permissions:
  contents: write   # commit the refreshed latest.json/index.html back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest videos and render
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 build.py

      - name: Sign in to Google Cloud (keyless, via workload identity)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/112765892803/locations/global/workloadIdentityPools/github/providers/github
          service_account: ideas-winner@nerdscience-ideas.iam.gserviceaccount.com

      - name: Pick the daily ideas winner
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          pip install --quiet google-cloud-firestore
          python3 daily_winner.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json index.html sitemap.xml
          git diff --cached --quiet || { git commit -m "Daily refresh: latest videos"; git push; }

      - name: Stage public files
        run: mkdir -p public && cp -R index.html favicon.ico robots.txt sitemap.xml assets ideas public/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
